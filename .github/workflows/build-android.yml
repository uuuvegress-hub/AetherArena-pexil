name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4

      - name: Setup Godot templates and Android SDK settings
        run: |
          mkdir -p ~/.local/share/godot/export_templates ~/.config/godot
          cp -r /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/
          JAVA_HOME_DIR=$(dirname $(dirname $(readlink -f $(which javac))))
          SDK_DIR=${ANDROID_HOME:-/usr/lib/android-sdk}
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android \
            -keystore ~/debug.keystore -storepass android \
            -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          for f in editor_settings-4.tres editor_settings-4.3.tres; do
          cat > ~/.config/godot/$f <<SETTINGS
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$SDK_DIR"
          export/android/java_sdk_path = "$JAVA_HOME_DIR"
          export/android/debug_keystore = "$HOME/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          SETTINGS
          done
          sed -i 's/^ *//' ~/.config/godot/editor_settings-4*.tres

      - name: Import project resources
        run: |
          godot --headless --import || true
          godot --headless --import || true

      - name: Export debug APK
        run: |
          mkdir -p build
          godot --headless --verbose --export-debug "Android" build/AetherArena.apk
          ls -la build

      - uses: actions/upload-artifact@v4
        with:
          name: AetherArena-apk
          path: build/AetherArena.apk
